on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  XTL_CI: "1"
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        host:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.host.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and test
        run: |
          docker compose run --build -e XTL_CI=1 xtool bash -c \
            "swift build --product xtool && .build/debug/xtool --help && swift test"
  build-macos:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/configure-xcode
      - name: Build
        run: |
          swift build --product xtool && .build/debug/xtool --help
      - name: Run tests
        run: |
          swift test
      - name: Run macOS integration tests
        run: |
          for lib in bats-core@v1.14.0 bats-support@v0.3.0 bats-assert@v2.2.4; do
            git -c advice.detachedHead=false clone -q --depth 1 --branch "${lib#*@}" "https://github.com/bats-core/${lib%@*}" ".build/bats/${lib%@*}"
          done
          mkdir -p .build/integration-bin
          ln -fs "$PWD/.build/debug/xtool" .build/integration-bin/xtool
          ln -fs "$(xcrun -f llvm-objdump)" .build/integration-bin/llvm-objdump
          PATH="$PWD/.build/integration-bin:$PATH" BATS_LIB_PATH="$PWD/.build/bats" \
            .build/bats/bats-core/bin/bats integration-tests/suite/macos.bats
  build-ios:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/configure-xcode
      - name: Build
        run: |
          set -o pipefail \
          && xcodebuild build \
            -skipMacroValidation -skipPackagePluginValidation \
            -scheme XKit -destination generic/platform=iOS \
          | xcbeautify
